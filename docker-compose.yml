version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: odisha-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: odisha-backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=odisha_vision_2047
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: odisha-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend

volumes:
  mongo_data:
